<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="Return versus throughput for four configurations"><style>
  .surf{fill:#fcfcfb}
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}
  .grid{stroke:#dcdbd7;stroke-width:1}
  .axis{stroke:#a9a8a3;stroke-width:1}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}
  .l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
  .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){
    .surf{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}
    .grid{stroke:#3a3a38}.axis{stroke:#5c5b57}
    .s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}
    .l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}
  }
</style><rect class="surf" width="720" height="330" rx="6"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">Two config lines: 1.9× the speed, no loss in return</text><text class="ink2" x="16" y="45" font-size="12">cheetah-run, 400k steps. Up and to the right is better.</text><line class="grid" x1="72" y1="239.8" x2="662" y2="239.8"/><text class="ink2" x="64" y="243.8" font-size="11" text-anchor="end">840</text><line class="grid" x1="72" y1="194.4" x2="662" y2="194.4"/><text class="ink2" x="64" y="198.4" font-size="11" text-anchor="end">865</text><line class="grid" x1="72" y1="148.9" x2="662" y2="148.9"/><text class="ink2" x="64" y="152.9" font-size="11" text-anchor="end">890</text><line class="grid" x1="72" y1="103.5" x2="662" y2="103.5"/><text class="ink2" x="64" y="107.5" font-size="11" text-anchor="end">915</text><line class="grid" x1="72" y1="58.0" x2="662" y2="58.0"/><text class="ink2" x="64" y="62.0" font-size="11" text-anchor="end">940</text><text class="ink2" x="72.0" y="278" font-size="11" text-anchor="middle">30</text><text class="ink2" x="203.1" y="278" font-size="11" text-anchor="middle">40</text><text class="ink2" x="334.2" y="278" font-size="11" text-anchor="middle">50</text><text class="ink2" x="465.3" y="278" font-size="11" text-anchor="middle">60</text><text class="ink2" x="596.4" y="278" font-size="11" text-anchor="middle">70</text><text class="ink2" x="367" y="298" font-size="12" text-anchor="middle">throughput (env steps / second)</text><text class="ink2" x="16" y="158" font-size="12" transform="rotate(-90 16 158)" text-anchor="middle">return @400k</text><circle class="s2" cx="148.0" cy="199.1" r="9"/><text class="ink" x="148.0" y="183.1" font-size="12" font-weight="600" text-anchor="middle">default</text><circle class="s4" cx="334.2" cy="111.5" r="9"/><text class="ink" x="334.2" y="95.5" font-size="12" font-weight="600" text-anchor="middle">depth 2–3</text><circle class="s3" cx="321.1" cy="144.7" r="9"/><text class="ink" x="321.1" y="128.7" font-size="12" font-weight="600" text-anchor="middle">update ratio 2</text><circle class="s1" cx="568.9" cy="114.5" r="9"/><text class="ink" x="568.9" y="98.5" font-size="12" font-weight="600" text-anchor="middle">both</text><line class="axis" x1="72" y1="258" x2="662" y2="258"/></svg>