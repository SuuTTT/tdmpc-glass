</style><rect class="surf" width="720" height="360" rx="6"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">How much of the objective can you remove? Three tasks, three shapes</text><text class="ink2" x="16" y="45" font-size="12">DreamerV3, return as % of that task’s own full-objective score.</text><line class="grid" x1="62" y1="282.0" x2="662" y2="282.0"/><text class="ink2" x="54" y="286.0" font-size="11" text-anchor="end">0%</text><line class="grid" x1="62" y1="232.0" x2="662" y2="232.0"/><text class="ink2" x="54" y="236.0" font-size="11" text-anchor="end">25%</text><line class="grid" x1="62" y1="182.0" x2="662" y2="182.0"/><text class="ink2" x="54" y="186.0" font-size="11" text-anchor="end">50%</text><line class="grid" x1="62" y1="132.0" x2="662" y2="132.0"/><text class="ink2" x="54" y="136.0" font-size="11" text-anchor="end">75%</text><line class="grid" x1="62" y1="82.0" x2="662" y2="82.0"/><text class="ink2" x="54" y="86.0" font-size="11" text-anchor="end">100%</text><text class="ink2" x="62.0" y="302" font-size="11.5" text-anchor="middle">1</text><text class="ink2" x="212.0" y="302" font-size="11.5" text-anchor="middle">0.5</text><text class="ink2" x="362.0" y="302" font-size="11.5" text-anchor="middle">0.25</text><text class="ink2" x="512.0" y="302" font-size="11.5" text-anchor="middle">0.1</text><text class="ink2" x="662.0" y="302" font-size="11.5" text-anchor="middle">0</text><text class="ink2" x="362" y="322" font-size="12" text-anchor="middle">world-model loss weight (dyn scale) — 1.0 is the default, 0 removes it</text><path class="ln l1" d="M62.0,82.0 L212.0,82.0 L362.0,83.2 L512.0,257.8 L662.0,272.6"/><circle class="s1" cx="62.0" cy="82.0" r="4.5"/><circle class="s1" cx="212.0" cy="82.0" r="4.5"/><circle class="s1" cx="362.0" cy="83.2" r="4.5"/><circle class="s1" cx="512.0" cy="257.8" r="4.5"/><circle class="s1" cx="662.0" cy="272.6" r="4.5"/><path class="ln l2" d="M62.0,82.0 L212.0,105.4 L362.0,142.2 L512.0,209.4 L662.0,232.4"/><circle