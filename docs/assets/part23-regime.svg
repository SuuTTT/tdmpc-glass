<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="World-model ablation under two data regimes"><style>
  .surf{fill:#fcfcfb}
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}
  .grid{stroke:#dcdbd7;stroke-width:1}
  .axis{stroke:#a9a8a3;stroke-width:1}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}
  .l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
  .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){
    .surf{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}
    .grid{stroke:#3a3a38}.axis{stroke:#5c5b57}
    .s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}
    .l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}
  }
</style><rect class="surf" width="720" height="330" rx="6"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">Same ablation, same code — only the data regime differs</text><text class="ink2" x="16" y="45" font-size="12">cheetah-run, official TD-MPC2, n=3 each. Bars are mean return.</text><line class="grid" x1="78" y1="250.0" x2="678" y2="250.0"/><text class="ink2" x="70" y="254.0" font-size="11" text-anchor="end">0</text><line class="grid" x1="78" y1="212.0" x2="678" y2="212.0"/><text class="ink2" x="70" y="216.0" font-size="11" text-anchor="end">200</text><line class="grid" x1="78" y1="174.0" x2="678" y2="174.0"/><text class="ink2" x="70" y="178.0" font-size="11" text-anchor="end">400</text><line class="grid" x1="78" y1="136.0" x2="678" y2="136.0"/><text class="ink2" x="70" y="140.0" font-size="11" text-anchor="end">600</text><line class="grid" x1="78" y1="98.0" x2="678" y2="98.0"/><text class="ink2" x="70" y="102.0" font-size="11" text-anchor="end">800</text><line class="grid" x1="78" y1="60.0" x2="678" y2="60.0"/><text class="ink2" x="70" y="64.0" font-size="11" text-anchor="end">1000</text><rect class="s1" x="142.0" y="77.6" width="78" height="172.4" rx="4"/><text class="ink" x="181.0" y="70.6" font-size="12" font-weight="600" text-anchor="middle">907</text><rect class="s2" x="236.0" y="84.9" width="78" height="165.1" rx="4"/><text class="ink" x="275.0" y="77.9" font-size="12" font-weight="600" text-anchor="middle">869</text><text class="ink" x="228.0" y="272" font-size="12" font-weight="600" text-anchor="middle">on-policy</text><text class="ink2" x="228.0" y="288" font-size="10.5" text-anchor="middle">(each arm collects its own data)</text><text class="ink" x="228.0" y="42" font-size="14" font-weight="700" text-anchor="middle">1.04x</text><rect class="s1" x="442.0" y="133.2" width="78" height="116.8" rx="4"/><text class="ink" x="481.0" y="126.2" font-size="12" font-weight="600" text-anchor="middle">615</text><rect class="s2" x="536.0" y="217.1" width="78" height="32.9" rx="4"/><text class="ink" x="575.0" y="210.1" font-size="12" font-weight="600" text-anchor="middle">173</text><text class="ink" x="528.0" y="272" font-size="12" font-weight="600" text-anchor="middle">matched-data</text><text class="ink2" x="528.0" y="288" font-size="10.5" text-anchor="middle">(one shared frozen policy)</text><text class="ink" x="528.0" y="42" font-size="14" font-weight="700" text-anchor="middle">3.55x</text><line class="axis" x1="78" y1="250" x2="678" y2="250"/><rect class="s1" x="78" y="305" width="11" height="11" rx="2"/><text class="ink2" x="95" y="314" font-size="11.5">world model ON (cc=20)</text><rect class="s2" x="263" y="305" width="11" height="11" rx="2"/><text class="ink2" x="280" y="314" font-size="11.5">world model OFF (cc=0)</text></svg>