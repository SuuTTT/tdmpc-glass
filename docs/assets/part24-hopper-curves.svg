</style><rect class="surf" width="760" height="400" rx="6"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">hopper-hop: the planner buys nothing until ~150k, then it unlocks the task</text><text class="ink2" x="16" y="45" font-size="12">Mean return across seeds at each evaluation. The gate arm acts from the policy prior until 150k, then plans.</text><text class="ink2" x="16" y="62" font-size="12">Below ~150k the planning and no-planning arms are indistinguishable — the model is not yet good enough to plan through.</text><line class="grid" x1="66" y1="338.0" x2="686" y2="338.0"/><text class="ink2" x="58" y="342.0" font-size="11" text-anchor="end">0</text><line class="grid" x1="66" y1="278.5" x2="686" y2="278.5"/><text class="ink2" x="58" y="282.5" font-size="11" text-anchor="end">100</text><line class="grid" x1="66" y1="219.0" x2="686" y2="219.0"/><text class="ink2" x="58" y="223.0" font-size="11" text-anchor="end">200</text><line class="grid" x1="66" y1="159.4" x2="686" y2="159.4"/><text class="ink2" x="58" y="163.4" font-size="11" text-anchor="end">300</text><line class="grid" x1="66" y1="99.9" x2="686" y2="99.9"/><text class="ink2" x="58" y="103.9" font-size="11" text-anchor="end">400</text><text class="ink2" x="66.0" y="356" font-size="10.5" text-anchor="middle">0k</text><text class="ink2" x="221.0" y="356" font-size="10.5" text-anchor="middle">100k</text><text class="ink2" x="376.0" y="356" font-size="10.5" text-anchor="middle">200k</text><text class="ink2" x="531.0" y="356" font-size="10.5" text-anchor="middle">300k</text><text class="ink2" x="686.0" y="356" font-size="10.5" text-anchor="middle">400k</text><line class="dash" x1="298.5" y1="88" x2="298.5" y2="338"/><text class="ink2" x="304.5" y="101" font-size="10.5">gate fires (150k)</text><polyline class="ln l1" points="143.5,338.0 221.0,302.6 298.5,277.6 376.0,184.4 453.5,150.2 686.0,103.4"/><polyline class="ln l2" points="143.5,333.5 221.0,302.6 298.5,286.0 376.0,281.3 453.5,286.5 686.0,296.6"/><polyline class="ln l3" points="143.5,333.5 221.0,282.5 298.5,315.1 337.2,229.0 376.0,269.0 531.0,160.2 686.0,189.0"/><text class="ink" x="694.0" y="107.4" font-size="11" font-weight="600">planning throughout — 394</text><text class="ink" x="694.0" y="193.0" font-size="11" font-weight="600">gate at 150k — 250</text><text class="ink" x="694.0" y="300.6" font-size="11" font-weight="600">never planning — 70</text><line class="axis" x1="66" y1="338" x2="686" y2="338"/><text class="ink2" x="376" y="376" font-size="11.5" text-anchor="middle">environment steps</text></svg>