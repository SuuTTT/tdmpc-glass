<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" role="img" aria-label="Return against wall-clock, hopper-hop"><style>
  .surf{fill:#fcfcfb}
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}
  .grid{stroke:#dcdbd7;stroke-width:1}
  .axis{stroke:#a9a8a3;stroke-width:1}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}
  .l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
  .dash{stroke:#a9a8a3;stroke-width:1.5;stroke-dasharray:5 4}
  .dot1{fill:#2a78d6}.dot2{fill:#eb6834}.dot3{fill:#1baf7a}
  .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){
    .surf{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}
    .grid{stroke:#3a3a38}.axis{stroke:#5c5b57}
    .s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}
    .l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}
    .dot1{fill:#3987e5}.dot2{fill:#d95926}.dot3{fill:#199e70}
    .dash{stroke:#5c5b57}
  }
</style><rect class="surf" width="720" height="380" rx="6"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">The gate is a Pareto point, not a free lunch</text><text class="ink2" x="16" y="45" font-size="12">hopper-hop, same box (wall-clock is host-sensitive, so all three are from box1).</text><text class="ink2" x="16" y="62" font-size="12">Up and to the left is better: more return, less time.</text><line class="grid" x1="78" y1="314.0" x2="638" y2="314.0"/><text class="ink2" x="70" y="318.0" font-size="11" text-anchor="end">0</text><line class="grid" x1="78" y1="259.2" x2="638" y2="259.2"/><text class="ink2" x="70" y="263.2" font-size="11" text-anchor="end">100</text><line class="grid" x1="78" y1="204.5" x2="638" y2="204.5"/><text class="ink2" x="70" y="208.5" font-size="11" text-anchor="end">200</text><line class="grid" x1="78" y1="149.7" x2="638" y2="149.7"/><text class="ink2" x="70" y="153.7" font-size="11" text-anchor="end">300</text><line class="grid" x1="78" y1="95.0" x2="638" y2="95.0"/><text class="ink2" x="70" y="99.0" font-size="11" text-anchor="end">400</text><text class="ink2" x="136.9" y="332" font-size="10.5" text-anchor="middle">100m</text><text class="ink2" x="254.8" y="332" font-size="10.5" text-anchor="middle">120m</text><text class="ink2" x="372.7" y="332" font-size="10.5" text-anchor="middle">140m</text><text class="ink2" x="490.6" y="332" font-size="10.5" text-anchor="middle">160m</text><text class="ink2" x="608.5" y="332" font-size="10.5" text-anchor="middle">180m</text><polyline class="ln" points="531.9,98.2 408.1,176.9 190.0,275.9" stroke="#a9a8a3" stroke-width="1.5" stroke-dasharray="4 4"/><circle class="dot1" cx="531.9" cy="98.2" r="7"/><text class="ink" x="519.9" y="102.2" font-size="11.5" font-weight="600" text-anchor="end">planning throughout</text><text class="ink2" x="519.9" y="117.2" font-size="10.5" text-anchor="end">394 return · 167min</text><circle class="dot3" cx="408.1" cy="176.9" r="7"/><text class="ink" x="420.1" y="180.9" font-size="11.5" font-weight="600" text-anchor="start">gate at 150k</text><text class="ink2" x="420.1" y="195.9" font-size="10.5" text-anchor="start">250 return · 146min</text><circle class="dot2" cx="190.0" cy="275.9" r="7"/><text class="ink" x="202.0" y="279.9" font-size="11.5" font-weight="600" text-anchor="start">never planning</text><text class="ink2" x="202.0" y="294.9" font-size="10.5" text-anchor="start">70 return · 109min</text><line class="axis" x1="78" y1="314" x2="638" y2="314"/><text class="ink2" x="358" y="352" font-size="11.5" text-anchor="middle">wall-clock for 400k steps (minutes)</text><text class="ink2" x="18" y="199" font-size="11.5" transform="rotate(-90 18 199)" text-anchor="middle">return at 400k</text></svg>